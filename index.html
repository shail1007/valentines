<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valentine?</title>
  <style>
    :root { --pad: 22px; }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color: white;
      overflow: hidden;
    }

    /* Background image */
    .bg {
      position: fixed;
      inset: 0;
      background-image: url("us.jpg"); /* <- change if needed */
      background-size: cover;
      background-position: center;
      filter: saturate(1.05) contrast(1.05);
      transform: scale(1.02);
      z-index: -2;
    }

    /* Aesthetic overlay for readability */
    .overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(255, 120, 170, 0.20), rgba(0,0,0,0.65) 55%),
                  linear-gradient(to bottom, rgba(0,0,0,0.25), rgba(0,0,0,0.70));
      z-index: -1;
    }

    .wrap {
      height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--pad);
      text-align: center;
    }

    .card {
      width: min(560px, 92vw);
      padding: 26px 22px;
      border-radius: 22px;
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 18px 60px rgba(0,0,0,0.35);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 4.2vw, 44px);
      letter-spacing: -0.02em;
    }

    p {
      margin: 0 0 18px;
      opacity: 0.9;
    }

    .btns {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    button {
      border: none;
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #yesBtn {
      background: #ff2d6d;
      color: white;
      font-weight: 700;
    }

    #yesBtn:hover { transform: translateY(-1px); filter: brightness(1.03); }

    /* No button becomes "floating" */
    #noBtn {
      background: rgba(255,255,255,0.92);
      color: #111;
      font-weight: 650;
      position: absolute; /* important for moving */
      left: 50%;
      top: 60%;
      transform: translate(-50%, -50%);
    }

    #noBtn:active { transform: translate(-50%, -50%) scale(0.98); }

    #msg {
      margin-top: 16px;
      font-weight: 700;
      font-size: 18px;
      min-height: 1.4em;
    }

    .tiny {
      margin-top: 6px;
      font-size: 12px;
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <div class="bg"></div>
  <div class="overlay"></div>

  <div class="wrap">
    <div class="card">
      <h1>Will you be my valentine princess? 💘</h1>
      <p>choose wisely 😌</p>

      <div class="btns">
        <button id="yesBtn">Yes 🥰</button>
        <!-- no button is positioned absolutely, so it doesn't live inside btn row layout -->
      </div>

      <div id="msg"></div>
      <div class="tiny">(btw the “No” button is shy)</div>
    </div>
  </div>

  <button id="noBtn" aria-label="No">No 😅</button>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn  = document.getElementById("noBtn");
    const msg    = document.getElementById("msg");

    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

    // place "No" somewhere reasonable on load
    function placeNoInitial() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const rect = noBtn.getBoundingClientRect();

      const x = vw * 0.5;
      const y = vh * 0.68;

      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";
    }

    // move "No" to a random safe spot (not off-screen)
    function moveNoRandom() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const rect = noBtn.getBoundingClientRect();

      const padding = 16;
      const x = Math.random() * (vw - rect.width  - padding * 2) + padding + rect.width / 2;
      const y = Math.random() * (vh - rect.height - padding * 2) + padding + rect.height / 2;

      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";
    }

    // "dodge" behavior: if cursor gets close, scoot away
    function dodge(e) {
      const rect = noBtn.getBoundingClientRect();
      const bx = rect.left + rect.width / 2;
      const by = rect.top + rect.height / 2;

      const mx = e.clientX;
      const my = e.clientY;

      const dx = bx - mx;
      const dy = by - my;
      const dist = Math.hypot(dx, dy);

      // how close before it panics
      const panicRadius = 120;

      if (dist < panicRadius) {
        // push it away from cursor direction
        const push = (panicRadius - dist) + 40;
        const nx = dx / (dist || 1);
        const ny = dy / (dist || 1);

        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const nextLeft = clamp(bx + nx * push, 40, vw - 40);
        const nextTop  = clamp(by + ny * push, 40, vh - 40);

        noBtn.style.left = nextLeft + "px";
        noBtn.style.top  = nextTop  + "px";
      }
    }

    // YES click
    yesBtn.addEventListener("click", () => {
      msg.textContent = "YAYYY 😭💘 okay princess, you’re locked in. Screenshot this and send it to me 😌";
      // optional: confetti vibe (simple)
      yesBtn.textContent = "YESSS ✅";
      noBtn.style.display = "none";
    });

    // NO tries: move away
    noBtn.addEventListener("mouseenter", moveNoRandom);
    noBtn.addEventListener("mouseover", moveNoRandom);

    // If they try to click/tap it, it escapes too
    noBtn.addEventListener("mousedown", (e) => { e.preventDefault(); moveNoRandom(); });
    noBtn.addEventListener("touchstart", (e) => { e.preventDefault(); moveNoRandom(); }, { passive: false });

    // Cursor proximity dodge on desktop
    window.addEventListener("mousemove", dodge);

    // keep it on screen if resizing
    window.addEventListener("resize", placeNoInitial);

    placeNoInitial();
  </script>
</body>
</html>
